<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" role="img" aria-label="Joystick">
  <defs>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f7"/>
      <stop offset="45%" stop-color="#c0c0c8"/>
      <stop offset="100%" stop-color="#8a8a96"/>
    </linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2d95"/>
      <stop offset="100%" stop-color="#ff6bb5"/>
    </linearGradient>
  </defs>
  <!-- abstract joystick nub -->
  <circle cx="70" cy="80" r="42" fill="none" stroke="url(#chrome)" stroke-width="3"/>
  <circle cx="70" cy="80" r="16" fill="url(#pink)"/>
  <text x="140" y="98" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-size="78" font-weight="900" letter-spacing="-2" fill="url(#chrome)">JOYSTICK</text>
</svg>
